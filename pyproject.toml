[project]
name = "recall"
version = "0.1.0"
description = "RAG over personal course notes, with a hand-built evaluation harness."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11",
    "numpy>=2.0",
]

[project.optional-dependencies]
# The default embedder is local, so this is what a fresh clone installs to
# run the index. Tests need neither extra: they use a fake embedder.
local = ["sentence-transformers>=3.0"]
# Split per SPEC.md 5e: `hosted` meant "hosted embedder", and a second provider
# would have made the name install an embedding dependency for anyone who
# wanted a generator. The generation half lands when 5a's provider is named —
# the local generator needs no package at all, only a running Ollama.
hosted-embed = ["openai>=1.0"]
# SPEC.md 7a: the largest dependency addition in this project, scoped to an
# extra so `recall-search` stays installable without a web stack.
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
recall-ingest = "recall.ingestion.pipeline:main"
recall-index = "recall.indexing.build:main"
recall-search = "recall.retrieval.search:main"
recall-answer = "recall.generation.answer:main"
recall-serve = "recall.api.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
    "fastapi>=0.115",
    # starlette's TestClient asks for httpx2; httpx raises a deprecation warning.
    "httpx2>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# The suite must pass on a fresh clone with no corpus and no network, so the
# tests that download a real embedding model are deselected by default.
addopts = "-m 'not slow'"
markers = ["slow: needs the real embedding model downloaded (~440 MB)"]
