# Recall — the gold question set. SPEC.md 6b.
#
# Anchoring is 2c's: a label names a source file and a human-readable location,
# and resolves by a **verbatim snippet** matched whitespace- and case-normalised.
# The snippet is what binds; the location is for a human checking the label by
# hand. A label matching zero chunks is a hard error that fails the run, never a
# silent score of 0 — a stale label must not be able to look like a regression.
#
# Written from the source documents before any of them was run through
# retrieval, per 6b. Questions written while watching output drift toward what
# the system already finds, and then the score measures the drift.
#
# Composition (6b: stratified, with a per-format breakdown reported beside the
# headline, and about a quarter unanswerable):
#
#   deck            17    problem_sheet  7    syllabus  2     = 26 answerable
#   unanswerable     9                                        = 35 total
#
# Every unanswerable question was checked against the corpus before being
# written: each turns on a term appearing zero times, matched on word
# boundaries. 4 recorded that mistake twice — CIDR and "three way handshake"
# were both nearly logged as retrieval failures when the terms were simply
# absent — so absence here is measured, not assumed.

